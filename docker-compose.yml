services:
  nginx:
    image: nginx:1.24
    volumes:
      - ./lierc-nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./lierc-minimal-ui:/var/www/lierc-minimal-ui:ro
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - lierc-api
      - lierc-api-stream

  liercd:
    image: ghcr.io/lierc/lierc:latest
    command: [liercd]
    env_file: .env
    depends_on:
      - nsqd

  lierc-logger:
    image: ghcr.io/lierc/lierc:latest
    command: [lierc-logger]
    env_file: .env
    depends_on:
      nsqd:
        condition: service_started
      postgres:
        condition: service_healthy

  lierc-notify:
    image: ghcr.io/lierc/lierc:latest
    command: [lierc-notify]
    env_file: .env
    depends_on:
      nsqd:
        condition: service_started
      postgres:
        condition: service_healthy

  lierc-identd:
    image: ghcr.io/lierc/lierc:latest
    command: [lierc-identd]
    env_file: .env
    ports:
      - "113:113"
    depends_on:
      - liercd

  lierc-api:
    image: ghcr.io/lierc/lierc-api:latest
    env_file: .env
    depends_on:
      liercd:
        condition: service_started
      mailpit:
        condition: service_started
      postgres:
        condition: service_healthy

  lierc-api-stream:
    image: ghcr.io/lierc/lierc-api-go:latest
    command: [stream]
    env_file: .env
    depends_on:
      liercd:
        condition: service_started
      nsqd:
        condition: service_started
      postgres:
        condition: service_healthy

  postgres:
    build: ./lierc-postgres
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lierc", "-d", "lierc"]
      interval: 5s
      timeout: 5s
      retries: 10

  nsqd:
    image: nsqio/nsq:v1.3.0
    command: /nsqd

  nsqadmin:
    image: nsqio/nsq:v1.3.0
    command: /nsqadmin --nsqd-http-address=nsqd:4151
    ports:
      - "4171:4171"
    depends_on:
      - nsqd

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"

volumes:
  postgres:
