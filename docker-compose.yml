services:
  nginx:
    image: nginx:1.24
    volumes:
      - ./lierc-nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./lierc-web:/var/www/lierc-web:ro
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - lierc-api

  liercd:
    image: ghcr.io/lierc/lierc:latest
    command: [liercd]
    env_file: .env
    depends_on:
      - nsqd
      - ergo

  # lierc-ingest (logs chats, saves config changes, notifies) is in lierc-api's image
  lierc-ingest:
    image: ghcr.io/lierc/lierc-api:latest
    command: [ingest]
    env_file: .env
    depends_on:
      nsqd:
        condition: service_started
      postgres:
        condition: service_healthy

  lierc-identd:
    image: ghcr.io/lierc/lierc:latest
    command: [lierc-identd]
    env_file: .env
    ports:
      - "113:113"
    depends_on:
      - liercd

  lierc-api:
    image: ghcr.io/lierc/lierc-api:latest
    env_file: .env
    environment:
      # /stats, for lierc-ingest's notifier on the compose network; never published
      # and not proxied by nginx.
      ADMIN_LISTEN: ":5009"
    depends_on:
      liercd:
        condition: service_started
      mailpit:
        condition: service_started
      nsqd:
        condition: service_started
      postgres:
        condition: service_healthy

  postgres:
    # lierc-api creates the schema (its migrations) when it starts.
    image: postgres:18
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lierc", "-d", "lierc"]
      interval: 5s
      timeout: 5s
      retries: 10

  nsqd:
    image: nsqio/nsq:v1.3.0
    command: /nsqd

  nsqadmin:
    image: nsqio/nsq:v1.3.0
    command: /nsqadmin --nsqd-http-address=nsqd:4151
    ports:
      - "4171:4171"
    depends_on:
      - nsqd

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"

  # The IRC server new signups are connected to (DEFAULT_NETWORK_* in
  # .env). Its config, accounts and certs live in the ergo volume.
  ergo:
    image: ghcr.io/ergochat/ergo:v2.19.1
    environment:
      ERGO__NETWORK__NAME: relaychat
    ports:
      - "6667:6667"
    volumes:
      - ergo:/ircd

volumes:
  postgres:
  ergo:
