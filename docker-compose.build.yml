# Build lierc images from local checkouts instead of pulling them:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up --build
x-lierc-build: &lierc-build
  build: ${LIERC_SRC:-../lierc}
  image: lierc-dev/lierc

services:
  liercd: *lierc-build
  lierc-logger: *lierc-build
  lierc-identd: *lierc-build
  lierc-api:
    build:
      context: ${LIERC_API_SRC:-../lierc-api}
      dockerfile: go.Dockerfile
    image: lierc-dev/lierc-api
