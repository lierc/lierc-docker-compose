server {
    listen       80;
    server_name  localhost;

    # Look up containers through Docker's DNS on every request, so
    # recreating a service doesn't leave nginx pointing at a stale IP.
    resolver 127.0.0.11 valid=10s;
    set $api http://lierc-api:5004;
    set $stream http://lierc-api-stream:5003;

    location /api/ {
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
    }

    location /api/events {
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        rewrite ^/api/events/?(.*)$ /$1 break;
        proxy_pass $stream;
    }

    location / {
        root /var/www/lierc-minimal-ui;
        index index.html;
    }

    location ~ /\.git {
        return 404;
    }
}
